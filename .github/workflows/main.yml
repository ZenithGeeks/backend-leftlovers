name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.1.30 # pin version for stability (recommended)

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 4️⃣ Type check (optional but recommended)
      - name: TypeScript type check
        run: bun run typecheck
        if: always()

      # 5️⃣ Run unit tests
      - name: Run unit tests
        run: bun test --coverage

      # 6️⃣ Upload coverage (optional)
      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
